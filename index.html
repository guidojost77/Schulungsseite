function filterCourses(){const q=$('search').value.toLowerCase(),cat=$('filter').value;const list=state.courses.filter(c=>allowed(c)&&(!cat||c.category===cat)&&c.title.toLowerCase().includes(q));$('course-list').innerHTML=list.map(card).join('')||'<p>Keine passenden Kurse.</p>'}
function renderLesson(){const c=state.courses.find(c=>c.id===courseId);if(!c||!allowed(c)){page='courses';render();return}const l=c.lessons.find(l=>l.id===lessonId)||c.lessons[0];lessonId=l?.id;$('main').innerHTML=heading(esc(c.title),'Kapitel und Lektionen in deinem eigenen Tempo bearbeiten.')+`<div class="row">${btn('Zur Kursübersicht','nav','courses')}${role==='teacher'?btn('Lektion hinzufügen','add-lesson',c.id,'primary'):''}</div><details class="card"><summary>Kursinformationen und Vorbereitung</summary>${detailFields.map(([key,label])=>`<p><strong>${label}</strong><br>${esc(c[key]||'Noch einzutragen')}</p>`).join('')}<p><strong>Lernform</strong><br>${esc(c.format||'Noch festzulegen')}</p></details><div class="split"><section class="card"><h3>Kursinhalt</h3>${c.lessons.map(x=>`<small>${esc(x.chapter)}</small>${btn((state.completed.includes(x.id)?'✓ ':'')+x.title,'lesson',x.id,'lesson-button')}`).join('')||'<p>Noch keine Lektionen.</p>'}</section><section class="card">${l?`<div class="eyebrow">${esc(l.chapter)}</div><h2>${esc(l.title)}</h2>${l.video?`<video controls preload="metadata" src="${esc(l.video)}">Dein Browser unterstützt diesen Videoplayer nicht.</video><small>Vorschau mit direkter Videodatei. Geschütztes Streaming wird später angebunden.</small>`:'<div class="video-empty"><strong>Video noch nicht hinterlegt</strong><small>Hier erscheint später das Unterrichtsvideo.</small></div>'}<p class="bodytext">${esc(l.body)}</p>${imageGallery(l)}${l.material?`<p><a href="${esc(l.material)}" target="_blank" rel="noopener noreferrer">Unterrichtsmaterial öffnen</a></p>`:''}<div class="row">${btn(state.completed.includes(l.id)?'Als offen markieren':'Lektion abgeschlossen','complete',l.id,'primary')}${role==='teacher'?btn('Lektion bearbeiten','edit-lesson',l.id)+btn('Frage hinzufügen','add-question',l.id):btn('Frage an die Dozenten','add-request',c.id)}</div><h3 style="margin-top:30px">Wissenscheck</h3>${l.questions.map(q=>`<form class="quiz" data-question="${esc(q.i function field(name,title,value='',type='text'){return `<label for="f-${name}">${title}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" required>`}
function area(name,title,value='',required=true){return `<label for="f-${name}">${title}</label><textarea id="f-${name}" name="${name}" ${required?'required':''}>${esc(value)}</textarea>`}
function picker(name,title,options,value){return `<label for="f-${name}">${title}</label><select id="f-${name}" name="${name}">${options.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
function editor(title,html,callback){$('dialog-title').textContent=title;$('editor').innerHTML=html+'<p><button class="primary" type="submit">Speichern</button></p>';$('editor').onsubmit=e=>{e.preventDefault();try{callback(new FormData(e.target));save();$('dialog').close();render()}catch(error){notify(error.message)}};$('dialog').showModal()}
function safeUrl(v){v=v.trim();if(!v)return '';let u;try{u=new URL(v)}catch{throw Error('Bitte eine vollständige https://-Adresse eintragen.')}if(u.protocol!=='https:')throw Error('Bitte eine https://-Adresse verwenden.');return u.href}

function parseImages(raw){return String(raw||'').split('\n').filter(x=>x.trim()).map(line=>{const split=line.indexOf('|');const url=split<0?line:line.slice(0,split),caption=split<0?'Unterrichtsbild':line.slice(split+1).trim();return {url:safeUrl(url),caption:caption||'Unterrichtsbild'};});}
function imageGallery(l){return (l.images||[]).length?`<section><h3>Bilder zur Lektion</h3>${l.images.map((x,i)=>`<figure style="margin:20px 0"><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer"><img loading="lazy" src="${esc(x.url)}" alt="${esc(x.caption)}" style="max-width:100%;max-height:550px;border-radius:10px;object-fit:contain"></a><figcaption class="muted">${i+1}. ${esc(x.caption)}</figcaption></figure>`).join('')}</section>`:'';}
function renderLive(){const events=state.events.filter(e=>(e.format==='Live online'||e.meeting)&&available().some(c=>c.id===e.course)).sort((a,b)=>a.start.localeCompare(b.start));$('main').innerHTML=heading('Live-Unterricht','Gemeinsam lernen über Kamera und Mikrofon. Kursbezogene Termine und Meeting-Links.')+(role==='teacher'?btn('Live-Termin anlegen','add-event','','primary'):'')+`<div class="card"><h2>So funktioniert die Teilnahme</h2><p>Öffne den Meeting-Link zum vereinbarten Termin. Die Videokonferenz startet auf der Seite des gewählten Anbieters. Dort erlaubst du bei Bedarf Kamera und Mikrofon.</p><p>Diese Vorschau enthält keinen eigenen Konferenzserver. Vertrauliche Meeting-Links bitte erst nach Anbindung der echten Anmeldung hinterlegen.</p></div>`+events.map(e=>`<article class="card"><span class="eyebrow">${esc(state.courses.find(c=>c.id===e.course)?.title)}</span><h2>${esc(e.title)}</h2><p>${esc(new Date(e.start).toLocaleString('de-DE'))} · ${e.minutes} Minuten</p><p>${esc(e.place)}</p>${e.meeting?`<a href="${esc(e.meeting)}" target="_blank" rel="noopener noreferrer">Live-Unterricht beitreten</a>`:'<p>Meeting-Link noch nicht hinterlegt.</p>'}${role==='teacher'?`<p>${btn('Termin entfernen','delete-event',e.id)}</p>`:''}</article>`).join('')+(!events.length?'<div class="card">Noch keine Live-Termine. Dozenten können einen Termin mit Unterrichtsform „Live online“ und Meeting-Link anlegen.</div>':'');}

document.addEventListener('submit',e=>{if(!e.target.matches('.quiz'))return;e.preventDefault();const q=currentLesson()?.questions.find(x=>x.id===e.target.dataset.question);if(!q)return;const right=Number(new FormData(e.target).get('answer'))===q.correct;const p=person(),c=state.courses.find(c=>c.id===courseId);p.results=p.results.filter(r=>r.question!==q.id);p.results.push({question:q.id,course:courseId,topic:c.topic||'Allgemein',correct:right,date:new Date().toISOString()});save();e.target.querySelector('.feedback').textContent=(right?'Richtig. ':'Noch nicht richtig. ')+q.explanation});
document.addEventListener('input',e=>{if(e.target.id==='search')filterCourses()});document.addEventListener('change',e=>{if(e.target.id==='filter')filterCourses();if(e.target.id==='analysis-group')updateAnalysis()});
